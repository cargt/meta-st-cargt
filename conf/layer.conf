# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cargt"
BBFILE_PATTERN_cargt := "^${LAYERDIR}/"
BBFILE_PRIORITY_cargt = "10"

EULA_FILE_ST:stm32mpcommonmx = "${LAYERDIR}/conf/eula/${MACHINE}"
EULA_FILE_ST_MD5SUM:stm32mpcommonmx = "8b505090fb679839cefbcc784afe8ce9"

# Set a variable to get the STM32MP BSP location
CARGT_BASE = "${LAYERDIR}"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_cargt = "1"
LAYERSERIES_COMPAT_cargt = "scarthgap"

LAYERDEPENDS_cargt = " "
# dependency with meta-networking for netperf, ntp
LAYERDEPENDS_cargt += " networking-layer "
# dependency with meta-webserver for netdata
LAYERDEPENDS_cargt += " webserver "
# dependency with meta-gnome for stsprof
LAYERDEPENDS_cargt += " gnome-layer "
# dependency with meta-multimedia for gstreamer dependency (faac)
LAYERDEPENDS_cargt += " multimedia-layer"

INHERIT += "check-st-openstlinux-compatibility"
# OpenSTLinux compatibility version
ST_OSTL_COMPATIBILITY_VERSION_cargt = "6.1"

# Runtime-only links from CPU-tune packages to board-specific ones. These
# recipes only RDEPEND/RRECOMMEND the board package (they don't build against
# it), so it must not make their own signature board-specific - otherwise they
# would collide between boards in the shared cortexa35/all deb feeds.
SIGGEN_EXCLUDE_SAFE_RECIPE_DEPS += " \
    openssl->cryptodev-module \
    rauc->libubootenv \
    rauc->rauc-conf \
    u-boot-fw-config-stm32mp->libubootenv \
    initramfs-live-install->busybox \
    initramfs-live-install-efi->busybox \
    initramfs-module-install->busybox \
    initramfs-module-install-efi->busybox \
    linux-firmware-addons-bcm43xx->bluetooth-suspend \
"

# PR note: the PR server numbers package revisions per package architecture, so
# a recipe that moves between the cortexa35 and board feeds restarts at .0 and
# would sort below the copy still in its old feed. The recipes moved by the
# shared-feed change bump PR once (r0 -> r1) so the new copy always wins.
