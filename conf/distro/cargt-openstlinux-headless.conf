#@NAME: openstlinux-headless
#@DESCRIPTION: OpenSTLinux headless - no display/compositor, no GPU userland (with GPLv3 software)

require include/cargt-default-distro-rules.inc
require include/cargt-default-distro-providers.inc
require include/cargt.inc

# =========================================================================
# Distribution definition for: st-openstlinux-headless-
# =========================================================================
DISTRO = "cargt-openstlinux-headless"
DISTRO_NAME = "Cargt OpenSTLinux - Headless - (A Yocto Project Based Distro)"

# =========================================================================
# DISTRO features
# =========================================================================
# For boards with no display interface at all. Unlike
# cargt-openstlinux-weston, this doesn't add opengl/vulkan/opencl back in,
# so no GPU userland gets pulled in either - camera capture (V4L2/DCMIPP)
# doesn't need GPU/EGL, so this is safe even if a camera is added to a
# headless board later; only a Qt-based camera preview UI would need
# wayland+qt together, and a headless board has no UI to build one for.
DISTRO_FEATURES:remove = " x11 wayland "

NETWORK_MANAGER = "networkmanager"
DISTRO_FEATURES:append = " systemd networkmanager"
RDEPENDS:packagegroup-core-tools-testapps:remove = "connman-tools connman-tests connman-client "

DISTRO_FEATURES:append = " gplv3 "

include conf/distro/include/cargt-base.inc
include conf/distro/include/cargt-preferred-env.inc
