# Cargt STM32MP2 boards: only the string "stop" stops autoboot. A stray byte
# on the console RX (floating input, USB-serial cable hot-plug, noise at power
# on) must not drop the board to the U-Boot prompt during the boot delay.
CONFIG_AUTOBOOT_KEYED=y
CONFIG_AUTOBOOT_PROMPT="Autoboot in %d seconds, type 'stop' to stop\n"
CONFIG_AUTOBOOT_STOP_STR="stop"
# CONFIG_AUTOBOOT_KEYED_CTRLC is not set
# CONFIG_AUTOBOOT_ENCRYPTION is not set
