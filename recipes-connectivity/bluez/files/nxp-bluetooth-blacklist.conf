# btnxpuart auto-probes via serdev as soon as the module loads, racing the
# IW610's WLAN/SDIO combo firmware load (moal/mlan) - which must finish
# first, since the same firmware image covers both radios. Loading
# btnxpuart before that races the chip and it fails to attach. Blacklisted
# here; nxp-bluetooth.service explicitly modprobes it once mlan0 exists.
blacklist btnxpuart
