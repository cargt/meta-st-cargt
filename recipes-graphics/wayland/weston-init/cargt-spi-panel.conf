# Use the weston.ini that cargt-weston-spi-panel.service writes for the
# 00379 SPI display. The env file only exists when that display is present,
# so other boards run Weston, and everything it starts, with their normal
# environment and /etc/xdg/weston/weston.ini.
[Service]
EnvironmentFile=-/run/cargt-weston/env
