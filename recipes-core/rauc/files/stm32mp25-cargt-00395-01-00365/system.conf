## RAUC system configuration for the Cargt 00395-01-00365 board.
## Installed to /etc/rauc/system.conf.
##
## A/B slots (rootfs/bootfs/vendorfs) are backed by the FIP-A/FIP-B and
## metadata1/metadata2 partitions already present in the flashlayout; TF-A
## BL2 picks the active bank from FWU metadata, so RAUC's bootloader backend
## is "custom", delegating to st-boot-script.sh instead of a u-boot-env one.
##
## Slot devices point at /run/cargt-part/<name>, not
## /dev/disk/by-partlabel/<name>: eMMC and SD card both carry partitions
## with the same names, so the system-wide by-partlabel symlink is
## ambiguous whenever both are present. /run/cargt-part/<name> is created
## at boot by cargt-device-symlinks.service, scoped to whichever physical
## device root is actually mounted from.

[system]
compatible=cargt-stm32mp25-00395-01-00365
bootloader=custom
mountprefix=/usr/local/rauc
max-bundle-download-size=805306368

[keyring]
path=/etc/rauc/ca.cert.pem

[handlers]
post-install=/usr/lib/rauc/post-install.sh
bootloader-custom-backend=/usr/lib/rauc/st-boot-script.sh

[slot.rootfs.0]
device=/run/cargt-part/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/run/cargt-part/rootfs-b
type=ext4
bootname=B

[slot.fip.0]
device=/run/cargt-part/fip-a
type=raw
parent=rootfs.0

[slot.fip.1]
device=/run/cargt-part/fip-b
type=raw
parent=rootfs.1

[slot.bootfs.0]
device=/run/cargt-part/bootfs-a
type=ext4
parent=rootfs.0

[slot.bootfs.1]
device=/run/cargt-part/bootfs-b
type=ext4
parent=rootfs.1

[slot.vendorfs.0]
device=/run/cargt-part/vendorfs-a
type=ext4
parent=rootfs.0

[slot.vendorfs.1]
device=/run/cargt-part/vendorfs-b
type=ext4
parent=rootfs.1
