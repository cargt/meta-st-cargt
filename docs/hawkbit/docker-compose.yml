# hawkBit test server for RAUC pull-based OTA testing - see
# ../rauc-ota-updates.md §5 for the full setup walkthrough.
#
# Host ports (8083/8088) are arbitrary - pick whatever's free on your
# machine, just keep it consistent with config.conf's hawkbit_server value.
# hawkbit-ui talks to the main server over the internal Docker network
# (port 8080, the container's own default), not the published host port.
services:
  hawkbit:
    image: hawkbit/hawkbit-update-server:latest
    container_name: hawkbit
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      # Uploaded bundle artifacts live at /app/artifactrepo, not /data as
      # might be guessed - confirmed by inspecting the running container
      # (`docker exec hawkbit find / -iname artifactrepo`). The Management
      # REST API's DELETE endpoints are soft-delete only (hide the DB row,
      # never free the underlying file) - if you're cycling many bundle
      # uploads through this server (e.g. a long stress test), plan to
      # periodically reclaim space with `docker compose down -v && up -d`
      # rather than relying on the API to do it. The in-memory H2 database
      # (targets, distribution sets, tokens) doesn't persist across a
      # restart either way - only the artifact files under this volume do.
      - hawkbit-data:/app/artifactrepo

  hawkbit-ui:
    image: hawkbit/hawkbit-ui:latest
    container_name: hawkbit-ui
    restart: unless-stopped
    environment:
      - 'SPRING_APPLICATION_JSON={"hawkbit.server.mgmtUrl": "http://hawkbit:8080"}'
    ports:
      - "8088:8088"
    depends_on:
      - hawkbit

volumes:
  hawkbit-data:
