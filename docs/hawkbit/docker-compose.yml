# hawkBit test server for RAUC pull-based OTA testing - see
# ../rauc-ota-updates.md §5 for the full setup walkthrough.
#
# Host ports (8083/8088) are arbitrary - pick whatever's free on your
# machine, just keep it consistent with config.conf's hawkbit_server value.
# hawkbit-ui talks to the main server over the internal Docker network
# (port 8080, the container's own default), not the published host port.
services:
  hawkbit:
    image: hawkbit/hawkbit-update-server:latest
    container_name: hawkbit
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - hawkbit-data:/data

  hawkbit-ui:
    image: hawkbit/hawkbit-ui:latest
    container_name: hawkbit-ui
    restart: unless-stopped
    environment:
      - 'SPRING_APPLICATION_JSON={"hawkbit.server.mgmtUrl": "http://hawkbit:8080"}'
    ports:
      - "8088:8088"
    depends_on:
      - hawkbit

volumes:
  hawkbit-data:
